# Supabase 免費方案的專案閒置一段時間會被暫停。
# 「一個月出遊一次」正好會踩到——所以每週叫醒它一次。
# ping() 順手把過期的空間清掉，所以這同時也是資料保留的清理工作。
#
# 沒有設定 SUPABASE_URL / SUPABASE_ANON_KEY 時這個工作會自己跳過。
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1' # 每週一 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping and purge expired rooms
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "尚未設定 SUPABASE_URL / SUPABASE_ANON_KEY，略過。"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
